<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beliz için</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,700&display=swap" rel="stylesheet">
<style>
:root{--top:#0A0D33;--mid:#241A57;--low:#5E3470;--text:#FBEFDD;--rose:#FFB3CC;color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(180deg,var(--top),var(--mid) 60%,var(--low));color:var(--text);
  font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%}
#neb{mix-blend-mode:screen;opacity:0;animation:drift 50s ease-in-out infinite alternate,nin 4s ease forwards}
#c{opacity:0;transition:opacity 2.4s ease}#c.on{opacity:1}
@keyframes drift{from{transform:scale(1.15) rotate(0) translate(0,0)}to{transform:scale(1.35) rotate(9deg) translate(-3%,2%)}}
@keyframes nin{to{opacity:.85}}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 38%,rgba(255,225,240,.95),rgba(255,150,200,.35) 35%,transparent 65%)}
#bar{position:fixed;left:0;top:0;height:2px;width:0;background:linear-gradient(90deg,transparent,var(--rose));margin-top:env(safe-area-inset-top,0px);transition:width 1.4s ease}
#ui{position:fixed;left:0;right:0;bottom:0;padding:0 1.5rem calc(2.4rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;
  align-items:center;gap:1.7rem;text-align:center;pointer-events:none}
#cap{margin:0;max-width:24rem;min-height:3.6em;display:flex;flex-wrap:wrap;gap:0 .3em;justify-content:center;align-items:flex-end;align-content:flex-end;
  font-style:italic;font-weight:500;font-size:clamp(1.7rem,6.4vw,2.5rem);line-height:1.18;text-shadow:0 2px 26px rgba(10,13,51,.9)}
#cap.big{font-size:clamp(2.6rem,11vw,4.2rem);font-weight:700;letter-spacing:.01em}
.w{display:inline-block;opacity:0;filter:blur(12px);transform:translateY(16px) scale(1.06);
  animation:win 1.2s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*150ms + 150ms)}
@keyframes win{to{opacity:1;filter:blur(0);transform:none}}
#next{pointer-events:auto;font:inherit;font-size:1.25rem;font-style:italic;color:var(--text);background:rgba(255,255,255,.08);
  border:1px solid rgba(255,235,220,.45);border-radius:999px;padding:.65rem 2.1rem;cursor:pointer;opacity:0;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:bin 1s ease forwards;transition:background .25s,border-color .25s,transform .25s}
#next:hover{background:rgba(255,179,204,.22);border-color:var(--rose);transform:scale(1.04)}
@keyframes bin{to{opacity:1}}
#ui.out #cap{opacity:0;filter:blur(10px);transition:opacity .6s,filter .6s}
#ui.out #next{animation:none;opacity:0;pointer-events:none;transition:opacity .4s}
#cnt{display:flex;gap:1.1rem;opacity:0;transform:translateY(10px);transition:opacity 1s ease 1.6s,transform 1s ease 1.6s}
#cnt.show{opacity:1;transform:none}
#cnt div{min-width:3.4rem}
#cnt b{display:block;font-size:clamp(1.9rem,8vw,2.6rem);font-weight:700;font-style:italic;font-variant-numeric:tabular-nums;line-height:1}
#cnt span{font-size:.95rem;opacity:.8;font-style:italic}
#ui.out #cnt{opacity:0;transition:opacity .4s}
:focus-visible{outline:3px solid var(--rose);outline-offset:4px}
@media (prefers-reduced-motion:reduce){.w{animation-duration:.01s;animation-delay:0s}#neb{animation:nin 1s forwards}}
</style>
</head>
<body>
<canvas id="neb"></canvas><canvas id="c"></canvas><div id="flash"></div><div id="bar"></div>
<div id="ui"><p id="cap" aria-live="polite"></p><div id="cnt" aria-label="Birlikte geçen süre"><div><b>0</b><span>gün</span></div><div><b>00</b><span>saat</span></div><div><b>00</b><span>dakika</span></div><div><b>00</b><span>saniye</span></div></div><button id="next" type="button"></button></div>
<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),nb=document.getElementById('neb'),fl=document.getElementById('flash'),
  bar=document.getElementById('bar'),cnt=document.getElementById('cnt'),ui=document.getElementById('ui'),cap=document.getElementById('cap'),btn=document.getElementById('next');
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var W,H,dpr,CX,CY,stars=[],hero=[],eN=[],eH=[],shoots=[],sparks=[],tN=0,tM=0,nameW=1,minX=0;
var scene=0,busy=false,formStart=1e12,morphStart=1e12,heroA=0,heroT=0,introA=1,px=0,py=0,tpx=0,tpy=0,last=0,nextShoot=0,nextFw=0,warpT=-1e9,warpDur=1500,fontsOK=false;
var SC=[
 {t:'Beliz için',b:'Başla',c:'big'},
 {t:'Bir gece yıldızlar senin adını yazdı.',b:'Devam'},
 {t:'Seni ilk gördüğüm an, her şey yavaşladı.',b:'Devam'},
 {t:'Sen güldüğünde yıldızlar bile sönük kalıyor.',b:'Devam'},
 {t:'26 Ekim’de tanıştık. O günden beri her saniye biraz daha güzel.',b:'Devam'},
 {t:'Kalbimin tam ortasında yerin var.',b:'Devam'},
 {t:'Kerem’den sevgiyle.',b:'Bir dilek tut',c:'big'},
 {t:'Dileğin gökyüzünde. Ben de hep yanındayım.',b:'Baştan izle'}
];
var COL=['255,244,220','200,220,255','255,214,230'];
function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function ease(k){return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2}

function nebula(){
  var w=nb.width=Math.ceil(W/3),h=nb.height=Math.ceil(H/3),o=nb.getContext('2d');
  [[.2,.25,.6,'120,80,255',.32],[.8,.45,.55,'255,110,170',.24],[.45,.85,.65,'80,150,255',.22],[.75,.08,.4,'200,90,255',.2]].forEach(function(b){
    var g=o.createRadialGradient(b[0]*w,b[1]*h,0,b[0]*w,b[1]*h,b[2]*Math.max(w,h));
    g.addColorStop(0,'rgba('+b[3]+','+b[4]+')');g.addColorStop(1,'rgba('+b[3]+',0)');o.fillStyle=g;o.fillRect(0,0,w,h)});
}
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;CX=W/2;CY=H*.38;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);nebula();
  var n=clamp(Math.round(W*H/4600),100,280);stars=[];
  for(var i=0;i<n;i++)stars.push({x:rnd(0,W),y:rnd(0,H),r:rnd(.4,1.5),z:rnd(.2,1),ph:rnd(0,6.28),sp:rnd(.0008,.003),c:COL[(Math.random()*3)|0]});
  if(fontsOK&&hero.length){build();if(scene>=1)formStart=-1e9;if(scene>=5)morphStart=-1e9}
}

function build(){
  var size=Math.min(W*.33,H*.3,260),step=size/11,pts,ow=Math.ceil(size*3.1),oh=Math.ceil(size*1.5);
  var oc=document.createElement('canvas');oc.width=ow;oc.height=oh;var o=oc.getContext('2d');
  o.font='italic 700 '+size+'px "Cormorant Garamond",Georgia,serif';o.textAlign='center';o.textBaseline='middle';
  o.fillStyle=o.strokeStyle='#fff';o.lineWidth=size*.05;o.fillText('Beliz',ow/2,oh/2);o.strokeText('Beliz',ow/2,oh/2);
  var d=o.getImageData(0,0,ow,oh).data,i,j;
  for(;;){pts=[];
    for(var y=step/2;y<oh;y+=step)for(var x=step/2;x<ow;x+=step)if(d[((y|0)*ow+(x|0))*4+3]>120)pts.push([x,y]);
    if(pts.length<=120)break;step*=1.12}
  var ox=CX-ow/2,oy=CY-oh/2,es={},list=[];
  for(i=0;i<pts.length;i++){var nb2=[];
    for(j=0;j<pts.length;j++){if(i===j)continue;var dd=Math.hypot(pts[i][0]-pts[j][0],pts[i][1]-pts[j][1]);if(dd<=step*1.6)nb2.push([dd,j])}
    nb2.sort(function(a,b){return a[0]-b[0]});
    nb2.slice(0,3).forEach(function(n){var a=Math.min(i,n[1]),b=Math.max(i,n[1]),k=a+'-'+b;if(!es[k]){es[k]=1;list.push([a,b])}})}
  var N=pts.length,M=Math.min(64,Math.floor(N*.65)),R=Math.min(W*.3,H*.17);
  hero=pts.map(function(p,idx){var h={tx:ox+p[0]+rnd(-1,1)*step*.14,ty:oy+p[1]+rnd(-1,1)*step*.14,sx:rnd(0,W),sy:rnd(-H*.2,H*.9),
    delay:reduce?0:rnd(0,N*26),dur:reduce?1:rnd(1800,2700),md:reduce?0:rnd(0,1200),mu:reduce?1:rnd(1600,2200),ph:rnd(0,6.28),big:Math.random()<.22,x:0,y:0,a:0};
    if(idx<M){var t=Math.PI*2*idx/M,s=Math.sin(t);h.hx=CX+s*s*s*R*1.1;h.hy=CY+R*.1-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/16*R}
    else{var u,v;do{u=rnd(-1.15,1.15);v=rnd(-1,1.3)}while(Math.pow(u*u+v*v-1,3)-u*u*v*v*v>0);h.hx=CX+u/1.15*R*.85;h.hy=CY+R*.1-(v-.1)*R*.8}
    return h});
  tN=0;tM=0;minX=1e9;var mx=-1e9;
  hero.forEach(function(h){tN=Math.max(tN,h.delay+h.dur);tM=Math.max(tM,h.md+h.mu);minX=Math.min(minX,h.tx);mx=Math.max(mx,h.tx)});nameW=mx-minX;
  list.sort(function(a,b){return(hero[a[0]].tx+hero[a[1]].tx)-(hero[b[0]].tx+hero[b[1]].tx)});
  eN=list.map(function(e,k){return{a:e[0],b:e[1],t:k/list.length}});
  eH=[];for(i=0;i<M;i++)eH.push({a:i,b:(i+1)%M,t:i/M*.6});
  for(i=M;i<N;i++){var bi=0,bd=1e9;for(j=0;j<M;j++){var q=Math.hypot(hero[i].hx-hero[j].hx,hero[i].hy-hero[j].hy);if(q<bd){bd=q;bi=j}}eH.push({a:i,b:bi,t:rnd(.5,1)})}
}

function spawn(x,y){var a=Math.PI*rnd(.72,.85),sp=rnd(700,1000);
  shoots.push({x:x!=null?x:rnd(W*.3,W*1.05),y:y!=null?y:rnd(-20,H*.35),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,age:0,life:rnd(.9,1.4),len:rnd(110,190)})}
function fw(x,y){var c=['255,214,230','255,236,190','200,220,255'][(Math.random()*3)|0];
  for(var i=0;i<34;i++){var a=rnd(0,6.283),s=rnd(70,260);sparks.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,age:0,life:rnd(1.1,1.8),c:c})}}
function burst(){for(var i=0;i<10;i++)setTimeout(spawn,i*260);fw(CX,H*.25)}

function lines(E,p,am){
  if(am<.01||p<=0)return;ctx.lineWidth=1;
  for(var j=0;j<E.length;j++){var e=E[j],a=clamp((p-e.t*.75)/.25,0,1);if(a<=0)continue;var A=hero[e.a],B=hero[e.b];
    ctx.strokeStyle='rgba(255,190,215,'+(.5*a*am).toFixed(3)+')';ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(A.x+(B.x-A.x)*a,A.y+(B.y-A.y)*a);ctx.stroke()}
}

function frame(now){
  var dt=Math.min((now-last)/1000,.05),i,s,x,y,tw;last=now;
  px+=(tpx-px)*.05;py+=(tpy-py)*.05;heroA+=(heroT-heroA)*.05;introA+=((scene===0?1:0)-introA)*.06;
  var wk=clamp((now-warpT)/warpDur,0,1),warp=reduce||wk>=1?0:Math.pow(Math.sin(Math.PI*wk),1.6);
  fl.style.opacity=(warp*.6).toFixed(3);
  ctx.clearRect(0,0,W,H);
  for(i=0;i<stars.length;i++){s=stars[i];
    x=(s.x+(reduce?0:now*.004*s.z)+px*s.z*16)%W;if(x<0)x+=W;y=s.y+py*s.z*10;
    tw=reduce?.8:.55+.45*Math.sin(now*s.sp+s.ph);var al=(tw*(.4+.6*s.z)).toFixed(3);
    if(warp>.02){ctx.strokeStyle='rgba('+s.c+','+al+')';ctx.lineWidth=s.r;ctx.beginPath();ctx.moveTo(x,y);
      ctx.lineTo(x-(x-CX)*warp*.35*s.z,y-(y-CY)*warp*.35*s.z);ctx.stroke()}
    else{ctx.fillStyle='rgba('+s.c+','+al+')';ctx.beginPath();ctx.arc(x,y,s.r,0,6.283);ctx.fill()}}
  if(introA>.01){var ia=introA*(.8+.2*Math.sin(now/600)),g=ctx.createRadialGradient(CX,CY,0,CX,CY,90);
    g.addColorStop(0,'rgba(255,240,225,'+ia+')');g.addColorStop(.15,'rgba(255,190,215,'+ia*.5+')');g.addColorStop(1,'rgba(255,190,215,0)');
    ctx.fillStyle=g;ctx.fillRect(CX-90,CY-90,180,180);ctx.fillStyle='rgba(255,250,240,'+introA+')';ctx.beginPath();ctx.arc(CX,CY,3,0,6.283);ctx.fill();
    ctx.strokeStyle='rgba(255,230,240,'+ia*.7+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(CX-60,CY);ctx.lineTo(CX+60,CY);ctx.moveTo(CX,CY-60);ctx.lineTo(CX,CY+60);ctx.stroke()}
  if(hero.length&&heroA>.01){
    var h,el,k,e,fx,fy,em,b=Math.sin(now/420);b=b>0?b*b:0;
    for(i=0;i<hero.length;i++){h=hero[i];el=now-formStart-h.delay;k=clamp(el/h.dur,0,1);e=ease(k);
      fx=h.sx+(h.tx-h.sx)*e;fy=h.sy+(h.ty-h.sy)*e;em=ease(clamp((now-morphStart-h.md)/h.mu,0,1));
      h.x=fx+(h.hx-fx)*em;h.y=fy+(h.hy-fy)*em;
      if(k>=1&&!reduce){h.x+=Math.sin(now/1100+h.ph)*1.2;h.y+=Math.cos(now/1300+h.ph)*1.2}
      if(scene>=5){var sc=1+.03*b*em;h.x=CX+(h.x-CX)*sc;h.y=CY+(h.y-CY)*sc}
      h.a=clamp(el/500,0,1)*heroA;h.em=em}
    lines(eN,clamp((now-formStart-tN+500)/(reduce?1:2800),0,1),heroA*(1-clamp((now-morphStart)/1000,0,1)));
    lines(eH,clamp((now-morphStart-tM+400)/(reduce?1:2400),0,1),heroA);
    var wx=minX+((now/2600)%1.4-.2)*nameW,wave=scene>=2&&scene<=4&&!reduce;
    ctx.shadowColor='rgba(255,200,225,.95)';ctx.shadowBlur=10;
    for(i=0;i<hero.length;i++){h=hero[i];if(h.a<=0)continue;
      var r=(h.big?2.5:1.7)+(wave?Math.max(0,1-Math.abs(h.tx-wx)/(nameW*.2))*2.4:0)+(scene>=5&&!reduce?h.em*.4*Math.sin(now/700+h.ph):0);
      ctx.fillStyle='rgba(255,244,230,'+h.a.toFixed(3)+')';ctx.beginPath();ctx.arc(h.x,h.y,Math.max(.5,r),0,6.283);ctx.fill()}
    ctx.shadowBlur=0}
  if(!reduce){
    if(scene>=1&&now>nextShoot){spawn();nextShoot=now+rnd(4000,9000)}
    if(scene===7&&now>nextFw){fw(rnd(W*.15,W*.85),rnd(H*.1,H*.5));nextFw=now+rnd(600,1300)}
    for(i=shoots.length-1;i>=0;i--){var m=shoots[i];m.age+=dt;m.x+=m.vx*dt;m.y+=m.vy*dt;if(m.age>m.life){shoots.splice(i,1);continue}
      var f=1-m.age/m.life,n=Math.hypot(m.vx,m.vy),tx=m.x-m.vx/n*m.len*f,ty=m.y-m.vy/n*m.len*f,gr=ctx.createLinearGradient(m.x,m.y,tx,ty);
      gr.addColorStop(0,'rgba(255,245,230,'+f+')');gr.addColorStop(1,'rgba(255,200,225,0)');
      ctx.strokeStyle=gr;ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(tx,ty);ctx.stroke()}
    for(i=sparks.length-1;i>=0;i--){var p=sparks[i];p.age+=dt;if(p.age>p.life){sparks.splice(i,1);continue}
      p.vy+=120*dt;p.vx*=.985;p.vy*=.985;p.x+=p.vx*dt;p.y+=p.vy*dt;
      ctx.fillStyle='rgba('+p.c+','+(1-p.age/p.life).toFixed(3)+')';ctx.beginPath();ctx.arc(p.x,p.y,1.8,0,6.283);ctx.fill()}}
  requestAnimationFrame(frame)
}

function setScene(n){
  var S=SC[n],words=S.t.split(' ');cap.className=S.c||'';
  cap.innerHTML=words.map(function(w,i){return'<span class="w" style="--i:'+i+'">'+w+'</span>'}).join(' ');
  btn.textContent=S.b;btn.style.animation='none';void btn.offsetWidth;btn.style.animation='';
  btn.style.animationDelay=(reduce?0:words.length*150+900)+'ms';cnt.classList.toggle('show',n===4);ui.classList.remove('out');bar.style.width=(n/(SC.length-1)*100)+'%'}
function go(n){
  if(busy)return;busy=true;var dur=reduce?10:1500;warpT=performance.now();warpDur=dur;ui.classList.add('out');
  setTimeout(function(){var now=performance.now();scene=n;setScene(n);
    if(n===1){if(!hero.length)build();hero.forEach(function(h){h.sx=rnd(0,W);h.sy=rnd(-H*.2,H*.9)});formStart=now;morphStart=1e12;heroT=1}
    if(n===5)morphStart=now;
    if(n===7){burst();nextFw=now+1500}
    if(n===0){heroT=0;morphStart=1e12}},dur*.5);
  setTimeout(function(){busy=false},dur);
}
btn.addEventListener('click',function(){go((scene+1)%SC.length)});
addEventListener('pointermove',function(e){tpx=(e.clientX/W-.5)*2;tpy=(e.clientY/H-.5)*2});
cv.addEventListener('pointerdown',function(e){if(scene>=6&&!reduce){fw(e.clientX,e.clientY);spawn(e.clientX,e.clientY)}});
addEventListener('resize',resize);
var T0=new Date(2026,9,26).getTime(),cb=cnt.getElementsByTagName('b');
function tick(){var d=Math.max(0,Date.now()-T0),v=[Math.floor(d/864e5),Math.floor(d/36e5)%24,Math.floor(d/6e4)%60,Math.floor(d/1e3)%60];for(var i=0;i<4;i++)cb[i].textContent=i?('0'+v[i]).slice(-2):v[i]}
tick();setInterval(tick,500);

resize();
function ready(){fontsOK=true;if(!hero.length)build()}
(document.fonts&&document.fonts.load?document.fonts.load('italic 700 40px "Cormorant Garamond"'):Promise.resolve()).then(ready,ready);
setTimeout(function(){if(!fontsOK)ready()},2500);
nextShoot=performance.now()+4000;
requestAnimationFrame(function(t){last=t;requestAnimationFrame(frame)});
setTimeout(function(){cv.classList.add('on')},200);
setTimeout(function(){setScene(0)},1800);
})();
</script>
</body>
</html>
